minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Exact versions approved for the glob and minimatch security fixes.
  - glob@14.0.2
  - minimatch@11.0.1
  - path-scurry@3.0.0
  - '@isaacs/nonrecursive-glob-match@1.0.1'
  # Security fix for GHSA-68fv-2mgg-jv7q; restrict the exception to this release.
  - source-map-js@1.2.2
  # Approved 2026-10-25 for the patched fast-uri 3.x security release only.
  - fast-uri@3.1.9
blockExoticSubdeps: true

overrides:
  '@sentry/bundler-plugin-core@5.3.0>glob': 14.0.2
  '@sentry/bundler-plugins@10.76.2>glob': 14.0.2
  '@sentry/bundler-plugins@11>glob': 14.0.2
  'glob@14.0.2>path-scurry': 3.0.0
  'minimatch@11.0.1>@isaacs/nonrecursive-glob-match': 1.0.1
  'minimatch': 11.0.1
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'zod@>=4.0.0 <4.6.6': 4.6.6
  # The Next ESLint plugin only uses globSync with onlyDirectories. Tinyglobby
  # supports that API without the unpatched braces dependency (GHSA-vfj7-8cjw-p6xm).
  '@next/eslint-plugin-next>fast-glob': npm:tinyglobby@0.2.17

# Keep legacy lint callers working with the fixed minimatch CommonJS export.
patchedDependencies:
  minimatch@11.0.1: patches/minimatch@11.0.1.patch
