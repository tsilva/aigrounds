name: Production delivery

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/production-delivery.yml
  workflow_dispatch:
    inputs:
      stage_prebuilt:
        description: Stage and verify a GitHub-built artifact without changing production domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  deliver:
    needs: secrets
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@48a4449de4ac5f4d5e14343f70fe5fc57bc2cd74
    with:
      sync_only: ${{ inputs.stage_prebuilt }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  verify-reader-isolation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      id-token: write
    steps:
      - name: Ordinary caller must be denied the shared reader
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,urllib.parse,base64
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'];assert urllib.parse.urlsplit(url).hostname.endswith('.actions.githubusercontent.com')
          r=urllib.request.Request(url+('&' if '?' in url else '?')+urllib.parse.urlencode({'audience':'https://app.infisical.com'}),headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(r,timeout=20) as resp:jwt=json.load(resp)['value']
          claims=json.loads(base64.urlsafe_b64decode(jwt.split('.')[1]+'==='))
          assert claims['workflow_ref']=='tsilva/aigrounds/.github/workflows/production-delivery.yml@refs/heads/main'
          assert claims['repository_id']=='1176162073' and claims['environment']=='Production'
          assert claims.get('job_workflow_ref') != 'tsilva/.github/.github/workflows/production-delivery.yml@48a4449de4ac5f4d5e14343f70fe5fc57bc2cd74'
          r=urllib.request.Request('https://app.infisical.com/api/v1/auth/oidc-auth/login',data=json.dumps({'identityId':'672c01c3-c025-40f9-b89b-5abcc03e8261','jwt':jwt}).encode(),headers={'Content-Type':'application/json'},method='POST')
          try:
           with urllib.request.urlopen(r,timeout=20) as resp:resp.read()
           raise SystemExit('SECURITY CHECK FAILED: ordinary job unexpectedly authenticated.')
          except urllib.error.HTTPError as error:
           if error.code not in (400,401,403):raise SystemExit('Unexpected authentication status; private response suppressed.')
           print('Verified: ordinary Production job on the allowed caller path was denied Infisical access (HTTP '+str(error.code)+').')

  stage_prebuilt:
    needs: deliver
    if: github.ref == 'refs/heads/main' && inputs.stage_prebuilt
    uses: tsilva/.github/.github/workflows/vercel-prebuilt.yml@22bb600ee7e3b22d238b284c132a3ad64a968719
    with:
      project_id: prj_Ktcv99ngBNGKzh3hFdM1XbzEl1PS
      project_name: aigrounds
      production_domains: '["aigrounds.tsilva.eu","aigrounds.vercel.app"]'
      public_environment: '["NEXT_PUBLIC_GA_MEASUREMENT_ID","NEXT_PUBLIC_SENTRY_DSN","SENTRY_ORG","SENTRY_PROJECT"]'
      source_maps: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
